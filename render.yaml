# Render Blueprint — ChildCareViz full app (Node web service).
# Flow: Render dashboard → New → Blueprint → connect rsshethia/childcareviz → Apply.
# Service serves dashboard/ static + live Neon API (src/server.ts).
services:
  - type: web
    name: childcareviz
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: DATABASE_URL
        sync: false
      # ...or PG* parts (pool.ts accepts either):
      # - key: PGHOST
      #   sync: false
      # - key: PGDATABASE
      #   sync: false
      # - key: PGUSER
      #   sync: false
      # - key: PGPASSWORD
      #   sync: false
      - key: MAPBOX_TOKEN
        sync: false
      - key: TYPESAFE_API_KEY
        sync: false
