# Render Blueprint — ChildCareViz.
# Today: static dashboard only (matches this repo: dashboard/*.html + data).
# Later: uncomment the api + cron sections when the Next.js API / scheduled
# re-crawl land. Secrets (DATABASE_URL etc.) are NOT needed for the static site.
services:
  - type: web
    name: childcareviz-dashboard
    env: static
    buildCommand: echo "static dashboard, nothing to build"
    staticPublishPath: ./dashboard
    # Auto-deploy on every push to main (re-export geo.json/data.json to refresh).

